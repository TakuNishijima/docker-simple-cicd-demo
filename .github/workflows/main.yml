name: Deploy Simple CI/CD

# イベントトリガーの設定
on:
  # メインブランチにプッシュされたときに動く
  push:
    branches: ["main"]
  # 環境変数の指定
env:
  # AWSリージョンの指定
  AWS_REGION: ap-northeast-1
  # ECSのサービス名を指定
  ECS_SERVICE: simple-cicd-service
  # ECSのクラスタ名を指定
  ECS_CLUSTER: simple-cicd-cluster
  # タスクデフィニションファイルの指定
  ECS_TASK_DEFINITION: .aws/task-definition.json

# 読み取り専用で権限を指定
permissions:
  contents: read

jobs: 
# webコンテナのビルド/テスト
  ## ソースの取得
  web-test-build-image:
    # GitHub Actions上に表示される名前を定義
    name: Web Container - Test and Build
    # 実行環境の定義
    runs-on: ubuntu-20.04
    timeout-minutes: 10
    
    defaults:
      # ワーキングディレクトリの設定
      run:
        working-directory: web
      
    steps:
    # Githubから持ってきたソースを実行環境上に動かしてくれるパッケージ的なのを使う宣言
      - uses: actions/checkout@v3

      # ビルド/テスト実施
      - name: Build an Image and Run Tests
        # Dockerイメージのビルド
        # web配下のDockerfile、productionイメージのビルド(名前を指定)、REACT_APP_API_SERVER変数に/apiを格納
        run: |
          docker image build --target production -t temp_web_image_name:latest --building-arg REACT_APP_API_SERVER=/api .
      # AWSにログイン 
      - name: Configure AWS credentials
        # AWSログイン用パッケージ的なの使う宣言
        uses: aws-actions/configure-aws-credentials@v1
        # ログインに使う変数の設定
        with:
          # アクセスキーIDとシークレットアクセスキーはsecretsファイルに定義したものを使用、リージョンは変数で定義したものを使用
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      # ECRにログインするための各種設定
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      # ECRにイメージをプッシュ
      - name: Push the image to Amazon ECR
        env:
          # login-ecrのステップでログインしたECRのレジストリを取得
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # secretsで定義したリポジトリを入れる
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_WEB_SERVER_REPOSITORY }}
        run: |
          docker image tag temp_web_image_name:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

# apiコンテナのビルド/テスト
  api-test-build-image:
    name: API Container - Test and Build
    runs-on: ubuntu-20.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
        
    steps:
      ## ソースの取得
      - uses: actions/checkout@v3
      ## ビルド/テスト実施
      ## Dockerイメージのビルド
      - name: Build an Image and Run Tests
        run: |
          docker image build --target production -t tmp_api_image_name:latest]
      # AWSにログイン 
      - name: Configure AWS credentials
       # AWSログイン用パッケージ的なの使う宣言
        uses: aws-actions/configure-aws-credentials@v1
      # ログインに使う変数の設定
        with:
          # アクセスキーIDとシークレットアクセスキーはsecretsファイルに定義したものを使用、リージョンは変数で定義したものを使用
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      # ECRにログインするための各種設定
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      # ECRにイメージをプッシュ
      - name: Push the image to Amazon ECR
        env:
          # login-ecrのステップでログインしたECRのレジストリを取得
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # secretsで定義したリポジトリを入れる
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_API_SERVER_REPOSITORY }}
        run: |
          docker image tag temp_web_image_name:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
  # デプロイ
  deploy:
    name: Deploy
    runs-on: ubuntu-20.04
    # 上記2つのジョブが終わっている必要があることを宣言
    needs: [web-test-build-image, api-test-build-image]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      # AWSにログイン 
      - name: Configure AWS credentials
      # AWSログイン用パッケージ的なの使う宣言
        uses: aws-actions/configure-aws-credentials@v1
      # ログインに使う変数の設定
        with:
      # アクセスキーIDとシークレットアクセスキーはsecretsファイルに定義したものを使用、リージョンは変数で定義したものを使用
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      # ECRにログインするための各種設定
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      # Web向けのtask definitionを書き換え
      - name: Fill in the new image ID in the Amazon ECS task definition for web
        id: render-web-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: web
          image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_ECR_WEB_SERVER_REPOSITORY }}
      # API向けのtask definitionを書き換え
      - name: Fill in the new image ID in the Amazon ECS task definition for api
        id: render-api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: api
          image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_API_WEB_SERVER_REPOSITORY }}
      # ECSへのデプロイ実行
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-api-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true